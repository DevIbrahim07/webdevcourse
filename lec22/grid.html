<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
    }
    .main {
      background-color: bisque;
      height: 100%;
      width: 100%;
      border: 2px solid black;
      display: grid;
      padding: 4rem;
      row-gap: 1rem;
      /* grid-template-columns: 100px 100px 100px;
      grid-template-rows: 80px 80px; */
      grid-template-rows: repeat(4, 1fr);
      grid-template-columns: 1fr 1fr 1fr;
      column-gap: 1rem;
    }

    .items {
      background-color: coral;
      border: 2px solid black;
    }
    .header,
    .footer {
      grid-column-start: 1;
      grid-column-end: 4;
    }
    .aside {
      grid-row-start: 2;
      grid-row-end: 4;
    }
    .content1 {
      grid-column-start: 2;
      grid-column-end: 4;
    }
    @media (max-width: 600px) {
      .main {
        /* grid-template-columns: 1fr 1fr; */
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto;
        background-color: blueviolet;
      }
    }
  </style>
  <body>
    <!-- grid??? is a two dimensional. is used for layouts creation  -->
    <div class="main">
      <div class="items header">header</div>
      <div class="items aside">aside</div>
      <div class="items content1">content1</div>
      <div class="items content2">content2</div>
      <div class="items content3">content3</div>
      <div class="items footer">footer</div>
    </div>
  </body>
</html>
