<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- here we will use div tage and its uses -->
    <!-- div tag is a block-level container used to group elements for styling or scripting 
      and layout purposes. it is like a wrapper/box-->
    <!-- block level element > always starts on a new line -->
    <!-- list of block level elements are div, p, h1-h6, ul, ol, li, table, header, 
      footer, section, article -->
    <!-- inline element > does not start on a new line -->
    <!-- list of inline elements are span, a, img, strong, em, br -->
    <!-- display inline elements are used to format small parts of a document jo block level elements 
      hai wo inline elements bn jata hai through display inline property -->
    <!-- div is a block level element  -->
    <div>
      <h2>This is a heading inside a div</h2>
      <p>This is a paragraph inside the same div.</p>
    </div>
    <p>This is a paragraph outside the div.</p>
    <span>This is an inline element inside a span.</span>
    <h2 class="display-inline">heading</h2>
  </body>
</html>
