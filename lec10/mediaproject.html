<!doctype html>
<html>
  <head>
    <title>HTML Media Project</title>
  </head>
  <body>
    <h1>HTML Media Gallery</h1>
    <p>This project shows how to use media in HTML.</p>

    <hr />

    <!-- Image Section -->
    <h2>Image Section</h2>
    <img src="https://via.placeholder.com/300" alt="Sample Image" />
    <p>This is a sample image.</p>

    <hr />

    <!-- Audio Section -->
    <h2>Audio Section</h2>
    <audio controls>
      <source src="sample.mp3" type="audio/mpeg" />
      Your browser does not support audio.
    </audio>

    <hr />

    <!-- Video Section -->
    <h2>Video Section</h2>
    <video width="400" controls>
      <source src="sample.mp4" type="video/mp4" />
      Your browser does not support video.
    </video>

    <hr />

    <!-- Iframe Section -->
    <h2>YouTube Video</h2>
    <iframe
      width="400"
      height="250"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      allowfullscreen
    >
    </iframe>

    <hr />

    <!-- Figure -->
    <h2>Figure with Caption</h2>
    <figure>
      <img src="https://via.placeholder.com/250" />
      <figcaption>Sample figure image with caption.</figcaption>
    </figure>

    <hr />

    <!-- Download Link -->
    <h2>Download File</h2>
    <a href="#" download>Download Sample File</a>
  </body>
</html>
